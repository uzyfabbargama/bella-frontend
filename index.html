<!DOCTYPE html>
<html>
<head>
    <title>Bella - Tu espejo emocional</title>
    <style>
        body { font-family: Arial; background: #0a0a0a; color: #eee; }
        #chat { height: 400px; overflow-y: auto; border: 1px solid #333; padding: 10px; }
        .user { 
            color: #4fc3f7; 
            text-shadow: 0 0 10px rgba(79, 195, 247, 0.3); 
        }
        .bella { 
            color: #ffb74d; 
            text-shadow: 0 0 10px rgba(255, 183, 77, 0.3); 
        }
        input { width: 80%; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>
    <h1>Bella</h1>
    
    <!-- Login/Registro -->
    <div id="auth">
        <input id="username" placeholder="Usuario">
        <input id="password" type="password" placeholder="Contraseña">
        <button onclick="registrar()">Registrar</button>
        <button onclick="login()">Iniciar Sesión</button>
    </div>
    
    <!-- Selección de personaje -->
    <div id="personajes" style="display:none;">
        <h2>Selecciona un personaje</h2>
        <div id="lista-personajes"></div>
        <button onclick="crearPersonaje()">Crear personaje</button>
    </div>
    
    <!-- Chat -->
    <div id="chat-container" style="display:none;">
        <div id="chat"></div>
        <input id="msg" placeholder="Escribe algo...">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>
    
    <script>
        const API_URL = 'https://compromise-bare-comparisons-room.trycloudflare.com';
        let token = null;
        let usuarioActual = null;
        let personajeActual = null;
        
        async function registrar() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch(`${API_URL}/api/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await response.json();
            alert(data.message || data.status);
        }
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            const data = await response.json();
            
            if (data.status === 'success') {
                token = data.token;
                usuarioActual = username;
                document.getElementById('auth').style.display = 'none';
                document.getElementById('personajes').style.display = 'block';
                cargarPersonajes();
            } else {
                alert('Error: ' + data.message);
            }
        }
        
        async function cargarPersonajes() {
            const response = await fetch(`${API_URL}/api/personajes`);
            const data = await response.json();
            
            const lista = document.getElementById('lista-personajes');
            lista.innerHTML = '';
            
            data.personajes.forEach(p => {
                const btn = document.createElement('button');
                btn.textContent = p.nombre;
                btn.onclick = () => iniciarChat(p.nombre);
                lista.appendChild(btn);
            });
        }
        
        function iniciarChat(nombre) {
            personajeActual = nombre;
            document.getElementById('personajes').style.display = 'none';
            document.getElementById('chat-container').style.display = 'block';
            document.getElementById('chat').innerHTML = '';
        }
        
        async function enviarMensaje() {
            const msg = document.getElementById('msg').value;
            if (!msg) return;
            
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="user">Tú: ${msg}</div>`;
            document.getElementById('msg').value = '';
            
            const response = await fetch(`${API_URL}/api/chat/${personajeActual}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mensaje: msg, usuario: usuarioActual})
            });
            const data = await response.json();
            
            if (data.status === 'success') {
                chat.innerHTML += `<div class="bella">${personajeActual}: ${data.respuesta}</div>`;
                chat.scrollTop = chat.scrollHeight;
            } else {
                chat.innerHTML += `<div class="bella">Error: ${data.message}</div>`;
            }
        }
        
        function crearPersonaje() {
            // Redirigir a página de creación (a implementar)
            alert('Función de creación de personajes (próximamente)');
        }
    </script>
</body>
</html>
