<!DOCTYPE html>
<html>
<head>
    <title>Bella - Tu espejo emocional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🌙 Bella</h1>

    <!-- ===== SECCIÓN 1: AUTH ===== -->
    <div id="auth" class="seccion">
        <input id="username" placeholder="Usuario">
        <input id="password" type="password" placeholder="Contraseña">
        <button onclick="registrar()">Registrar</button>
        <button onclick="login()">Iniciar Sesión</button>
    </div>

    <!-- ===== SECCIÓN 2: PERSONAJES ===== -->
    <div id="personajes" class="seccion" style="display:none;">
        <h2>Selecciona un personaje</h2>
        <div id="lista-personajes"></div>
        <button onclick="mostrarSeccion('creador')">✨ Crear personaje</button>
        <button class="volver" onclick="volverAHome()">⬅ Volver</button>
    </div>

    <!-- ===== SECCIÓN 3: CHAT ===== -->
    <div id="chat-container" class="seccion" style="display:none;">
        <div id="chat"></div>
        <input id="msg" placeholder="Escribe algo...">
        <button onclick="enviarMensaje()">Enviar</button>
        <button class="volver" onclick="volverAPersonajes()">⬅ Volver a personajes</button>
    </div>

    <!-- ===== SECCIÓN 4: CREADOR DE PERSONAJES ===== -->
    <div id="creador" class="seccion" style="display:none;">
        <h2>✨ Crear nuevo personaje</h2>
        
        <input id="nombre-personaje" placeholder="Nombre del personaje">
        <textarea id="intro-personaje" placeholder="Introducción..."></textarea>
        <textarea id="peculiaridad-personaje" placeholder="Peculiaridad..."></textarea>

        <h3>Ajustes de personalidad</h3>
        <div class="slider-container">
            <label>Bondad</label>
            <input type="range" id="bondad" min="0" max="1000" value="500" oninput="actualizarValor('bondad')">
            <span id="bondad-valor">500</span>
        </div>
        <div class="slider-container">
            <label>Hostilidad</label>
            <input type="range" id="hostilidad" min="0" max="1000" value="500" oninput="actualizarValor('hostilidad')">
            <span id="hostilidad-valor">500</span>
        </div>
        <div class="slider-container">
            <label>Lógica</label>
            <input type="range" id="logica" min="0" max="1000" value="500" oninput="actualizarValor('logica')">
            <span id="logica-valor">500</span>
        </div>
        <div class="slider-container">
            <label>Ambiición</label>
            <input type="range" id="ambicion" min="0" max="1000" value="500" oninput="actualizarValor('ambicion')">
            <span id="ambicion-valor">500</span>
        </div>
        <div class="slider-container">
            <label>Miedo</label>
            <input type="range" id="miedo" min="0" max="1000" value="500" oninput="actualizarValor('miedo')">
            <span id="miedo-valor">500</span>
        </div>
        <div class="slider-container">
            <label>Posesividad</label>
            <input type="range" id="posesividad" min="0" max="1000" value="500" oninput="actualizarValor('posesividad')">
            <span id="posesividad-valor">500</span>
        </div>

        <button onclick="crearPersonaje()">🚀 Crear personaje</button>
        <button class="volver" onclick="volverAPersonajes()">⬅ Volver</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
